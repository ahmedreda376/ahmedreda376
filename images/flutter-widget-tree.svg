<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Animated Flutter widget tree: MaterialApp, Scaffold, AppBar, ListView, FAB and FoodCard widgets build themselves while a phone UI and the Dart code appear in sync">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1f"/>
      <stop offset="1" stop-color="#171038"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F00FF"/>
      <stop offset="0.5" stop-color="#3A47D5"/>
      <stop offset="1" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#b66dff"/>
      <stop offset="0.5" stop-color="#7f8bff"/>
      <stop offset="1" stop-color="#00D2FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <clipPath id="screen">
      <rect x="58" y="48" width="174" height="374" rx="22"/>
    </clipPath>
    <clipPath id="c1"><rect x="288" y="350" width="0" height="17"><animate attributeName="width" values="0;0;540;540;0;0" keyTimes="0;0.35;0.4333;0.9;0.93;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="288" y="367" width="0" height="17"><animate attributeName="width" values="0;0;540;540;0;0" keyTimes="0;0.4333;0.5167;0.9;0.93;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="288" y="384" width="0" height="17"><animate attributeName="width" values="0;0;540;540;0;0" keyTimes="0;0.5167;0.6;0.9;0.93;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="288" y="401" width="0" height="17"><animate attributeName="width" values="0;0;540;540;0;0" keyTimes="0;0.6167;0.6833;0.9;0.93;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="288" y="418" width="0" height="17"><animate attributeName="width" values="0;0;540;540;0;0" keyTimes="0;0.6917;0.75;0.9;0.93;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,monospace; }
    .node { transform-box: fill-box; transform-origin: center; animation: grow 12s ease-in-out infinite backwards; animation-delay: var(--d); }
    .edge { animation: fade 12s ease-in-out infinite backwards; animation-delay: var(--d); }
    .edge path.line { stroke-dasharray: 100; animation: draw 12s ease-in-out infinite backwards; animation-delay: var(--d); }
    .card { animation: slide 12s ease-in-out infinite backwards; animation-delay: var(--d); }
    .pop { transform-box: fill-box; transform-origin: center; animation: grow 12s ease-in-out infinite backwards; animation-delay: var(--d); }
    @keyframes grow {
      0%   { opacity: 0; transform: scale(.6); }
      5%   { opacity: 1; transform: scale(1.08); }
      8%   { transform: scale(1); }
      86%  { opacity: 1; transform: scale(1); }
      94%, 100% { opacity: 0; transform: scale(.92); }
    }
    @keyframes fade {
      0% { opacity: 0; } 4% { opacity: 1; } 86% { opacity: 1; } 94%, 100% { opacity: 0; }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 100; } 8% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; }
    }
    @keyframes slide {
      0%   { opacity: 0; transform: translateX(56px); }
      6%   { opacity: 1; transform: translateX(0); }
      86%  { opacity: 1; transform: translateX(0); }
      94%, 100% { opacity: 0; transform: translateX(-24px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .node, .edge, .edge path.line, .card, .pop { animation: none; }
    }
  </style>

  <!-- Canvas -->
  <rect width="900" height="470" rx="18" fill="url(#bg)"/>
  <rect width="900" height="470" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="898" height="468" rx="17" fill="none" stroke="url(#brand)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Title -->
  <text x="270" y="50" font-size="22" font-weight="700" fill="url(#title)">Everything is a Widget</text>
  <text x="270" y="72" font-size="12" fill="#7d86b8">Ahmed Reda  /  Flutter &amp; Dart</text>

  <!-- ============ PHONE ============ -->
  <rect x="50" y="40" width="190" height="390" rx="30" fill="#05070f" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="58" y="48" width="174" height="374" rx="22" fill="#0b1020"/>

  <g clip-path="url(#screen)">
    <g class="pop" style="--d:1.7s">
      <rect x="58" y="48" width="174" height="52" fill="url(#brand)"/>
      <text x="74" y="82" font-size="14" font-weight="700" fill="#ffffff">FoodApp</text>
      <rect x="202" y="68" width="16" height="2.5" rx="1.2" fill="#ffffff"/>
      <rect x="202" y="75" width="16" height="2.5" rx="1.2" fill="#ffffff"/>
      <rect x="202" y="82" width="10" height="2.5" rx="1.2" fill="#ffffff"/>
    </g>

    <g class="card" style="--d:3s">
      <rect x="70" y="112" width="150" height="70" rx="12" fill="#1a2040" stroke="#2d3570"/>
      <circle cx="102" cy="147" r="22" fill="url(#brand)"/>
      <rect x="134" y="130" width="72" height="9" rx="4" fill="#e6e9ff"/>
      <rect x="134" y="147" width="50" height="7" rx="3.5" fill="#6b74a8"/>
      <rect x="134" y="162" width="34" height="10" rx="5" fill="#00D2FF"/>
    </g>
    <g class="card" style="--d:3.3s">
      <rect x="70" y="194" width="150" height="70" rx="12" fill="#1a2040" stroke="#2d3570"/>
      <circle cx="102" cy="229" r="22" fill="#b66dff"/>
      <rect x="134" y="212" width="60" height="9" rx="4" fill="#e6e9ff"/>
      <rect x="134" y="229" width="44" height="7" rx="3.5" fill="#6b74a8"/>
      <rect x="134" y="244" width="34" height="10" rx="5" fill="#00D2FF"/>
    </g>
    <g class="card" style="--d:3.6s">
      <rect x="70" y="276" width="150" height="70" rx="12" fill="#1a2040" stroke="#2d3570"/>
      <circle cx="102" cy="311" r="22" fill="#3A47D5"/>
      <rect x="134" y="294" width="68" height="9" rx="4" fill="#e6e9ff"/>
      <rect x="134" y="311" width="46" height="7" rx="3.5" fill="#6b74a8"/>
      <rect x="134" y="326" width="34" height="10" rx="5" fill="#00D2FF"/>
    </g>

    <g class="pop" style="--d:2.2s">
      <circle cx="198" cy="386" r="20" fill="url(#brand)"/>
      <path d="M198 377v18M189 386h18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="198" cy="386" r="20" fill="none" stroke="#00D2FF" stroke-width="2">
        <animate attributeName="r" values="20;34" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x="120" y="52" width="50" height="9" rx="4.5" fill="#05070f"/>

  <!-- ============ WIDGET TREE ============ -->
  <g class="edge" style="--d:.5s">
    <path class="line" pathLength="100" d="M380 207 L420 207" fill="none" stroke="#5b6bff" stroke-width="1.6"/>
    <circle r="3.2" fill="#00D2FF"><animateMotion dur="2.4s" repeatCount="indefinite" path="M380 207 L420 207"/></circle>
  </g>
  <g class="edge" style="--d:1.4s">
    <path class="line" pathLength="100" d="M530 207 C550 207 550 117 570 117" fill="none" stroke="#5b6bff" stroke-width="1.6"/>
    <circle r="3.2" fill="#00D2FF"><animateMotion dur="2.4s" repeatCount="indefinite" path="M530 207 C550 207 550 117 570 117"/></circle>
  </g>
  <g class="edge" style="--d:1.4s">
    <path class="line" pathLength="100" d="M530 207 L570 207" fill="none" stroke="#5b6bff" stroke-width="1.6"/>
    <circle r="3.2" fill="#00D2FF"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M530 207 L570 207"/></circle>
  </g>
  <g class="edge" style="--d:1.4s">
    <path class="line" pathLength="100" d="M530 207 C550 207 550 297 570 297" fill="none" stroke="#5b6bff" stroke-width="1.6"/>
    <circle r="3.2" fill="#00D2FF"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M530 207 C550 207 550 297 570 297"/></circle>
  </g>
  <g class="edge" style="--d:2.6s">
    <path class="line" pathLength="100" d="M680 207 C700 207 700 167 720 167" fill="none" stroke="#b66dff" stroke-width="1.6"/>
    <circle r="3.2" fill="#00D2FF"><animateMotion dur="2.4s" repeatCount="indefinite" path="M680 207 C700 207 700 167 720 167"/></circle>
  </g>
  <g class="edge" style="--d:2.6s">
    <path class="line" pathLength="100" d="M680 207 C700 207 700 247 720 247" fill="none" stroke="#b66dff" stroke-width="1.6"/>
    <circle r="3.2" fill="#00D2FF"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M680 207 C700 207 700 247 720 247"/></circle>
  </g>

  <g class="node" style="--d:0s">
    <rect x="270" y="190" width="110" height="34" rx="10" fill="none" stroke="#7F00FF" stroke-opacity="0.28" stroke-width="6"/>
    <rect x="270" y="190" width="110" height="34" rx="10" fill="#111633" stroke="#7F00FF" stroke-width="1.6"/>
    <text x="325" y="211" font-size="12" fill="#ffffff" text-anchor="middle">MaterialApp</text>
  </g>
  <g class="node" style="--d:.8s">
    <rect x="420" y="190" width="110" height="34" rx="10" fill="none" stroke="#5b6bff" stroke-opacity="0.28" stroke-width="6"/>
    <rect x="420" y="190" width="110" height="34" rx="10" fill="#111633" stroke="#5b6bff" stroke-width="1.6"/>
    <text x="475" y="211" font-size="12" fill="#ffffff" text-anchor="middle">Scaffold</text>
  </g>
  <g class="node" style="--d:1.7s">
    <rect x="570" y="100" width="110" height="34" rx="10" fill="none" stroke="#00D2FF" stroke-opacity="0.25" stroke-width="6"/>
    <rect x="570" y="100" width="110" height="34" rx="10" fill="#111633" stroke="#00D2FF" stroke-width="1.6"/>
    <text x="625" y="121" font-size="12" fill="#ffffff" text-anchor="middle">AppBar</text>
  </g>
  <g class="node" style="--d:1.95s">
    <rect x="570" y="190" width="110" height="34" rx="10" fill="none" stroke="#00D2FF" stroke-opacity="0.25" stroke-width="6"/>
    <rect x="570" y="190" width="110" height="34" rx="10" fill="#111633" stroke="#00D2FF" stroke-width="1.6"/>
    <text x="625" y="211" font-size="12" fill="#ffffff" text-anchor="middle">ListView</text>
  </g>
  <g class="node" style="--d:2.2s">
    <rect x="570" y="280" width="110" height="34" rx="10" fill="none" stroke="#00D2FF" stroke-opacity="0.25" stroke-width="6"/>
    <rect x="570" y="280" width="110" height="34" rx="10" fill="#111633" stroke="#00D2FF" stroke-width="1.6"/>
    <text x="625" y="301" font-size="12" fill="#ffffff" text-anchor="middle">FAB</text>
  </g>
  <g class="node" style="--d:3s">
    <rect x="720" y="150" width="110" height="34" rx="10" fill="none" stroke="#b66dff" stroke-opacity="0.28" stroke-width="6"/>
    <rect x="720" y="150" width="110" height="34" rx="10" fill="#111633" stroke="#b66dff" stroke-width="1.6"/>
    <text x="775" y="171" font-size="12" fill="#ffffff" text-anchor="middle">FoodCard</text>
  </g>
  <g class="node" style="--d:3.3s">
    <rect x="720" y="230" width="110" height="34" rx="10" fill="none" stroke="#b66dff" stroke-opacity="0.28" stroke-width="6"/>
    <rect x="720" y="230" width="110" height="34" rx="10" fill="#111633" stroke="#b66dff" stroke-width="1.6"/>
    <text x="775" y="251" font-size="12" fill="#ffffff" text-anchor="middle">FoodCard</text>
  </g>

  <!-- ============ CODE PANEL ============ -->
  <rect x="270" y="326" width="560" height="120" rx="12" fill="#0b1020" stroke="#2a3160"/>
  <circle cx="288" cy="339" r="4" fill="#ff5f57"/>
  <circle cx="302" cy="339" r="4" fill="#febc2e"/>
  <circle cx="316" cy="339" r="4" fill="#28c840"/>

  <g xml:space="preserve" font-size="12">
    <text x="290" y="362" clip-path="url(#c1)" style="white-space:pre"><tspan fill="#c792ea">class</tspan><tspan fill="#82e9ff"> FoodApp </tspan><tspan fill="#c792ea">extends</tspan><tspan fill="#ffcb6b"> StatelessWidget</tspan><tspan fill="#d6dcff"> {</tspan></text>
    <text x="290" y="379" clip-path="url(#c2)" style="white-space:pre"><tspan fill="#d6dcff">  </tspan><tspan fill="#ffcb6b">Widget</tspan><tspan fill="#82aaff"> build</tspan><tspan fill="#d6dcff">(context) =&gt; </tspan><tspan fill="#ffcb6b">MaterialApp</tspan><tspan fill="#d6dcff">(</tspan></text>
    <text x="290" y="396" clip-path="url(#c3)" style="white-space:pre"><tspan fill="#d6dcff">    home: </tspan><tspan fill="#ffcb6b">Scaffold</tspan><tspan fill="#d6dcff">(body: </tspan><tspan fill="#ffcb6b">ListView</tspan><tspan fill="#d6dcff">(children: cards)),</tspan></text>
    <text x="290" y="413" clip-path="url(#c4)" style="white-space:pre"><tspan fill="#d6dcff">  );</tspan></text>
    <text x="290" y="430" clip-path="url(#c5)" style="white-space:pre"><tspan fill="#d6dcff">}</tspan></text>
  </g>
  <rect x="300" y="419" width="7" height="13" fill="#00D2FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
