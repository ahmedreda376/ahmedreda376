name: Generate Profile Animations

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated SVGs
        run: |
          python3 - <<'PYEOF'
          import math, os
          os.makedirs('dist', exist_ok=True)
          F = "font-family:'Segoe UI',Ubuntu,Arial,sans-serif"
          M = "font-family:'Fira Code','Courier New',monospace"
          C = ['#00d2ff', '#7f00ff', '#f7b801', '#3ecf8e', '#ff6b9d']
          def esc(s): return s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
          def save(n, s): open('dist/' + n, 'w', encoding='utf-8').write(s)
          def svg(w, h, defs, css, body):
              return f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}"><defs>{defs}</defs><style>text{{{F}}}{css}</style>{body}</svg>'

          def terminal():
              w, h = 900, 330
              L = [('$ whoami', 1), ('Ahmed Reda - Flutter Developer | Dart | Mobile App Development', 0), ('$ cat about.txt', 1),
                   ("I'm a Flutter Developer passionate about building modern, scalable,", 0), ('and user-friendly mobile applications.', 0),
                   ('I enjoy turning ideas into practical applications using clean code,', 0), ('good architecture, and maintainable solutions.', 0),
                   ('$ flutter run', 1), ('✔ Always Learning. Always Building. 🚀', 0)]
              T = len(L) * 1.1 + 6
              clips = ''; txt = ''
              for i, (t, p) in enumerate(L):
                  y = 80 + i * 27; W = len(t) * 9.4 + 12
                  a = i * 1.1 / T; b = a + 0.9 / T
                  clips += f'<clipPath id="c{i}"><rect x="30" y="{y-19}" height="28" width="0"><animate attributeName="width" values="0;0;{W:.0f};{W:.0f};0" keyTimes="0;{a:.4f};{b:.4f};0.94;1" dur="{T:.1f}s" repeatCount="indefinite"/></rect></clipPath>'
                  inner = f'<tspan fill="#3ecf8e">$ </tspan><tspan fill="#00d2ff">{esc(t[2:])}</tspan>' if p else esc(t)
                  txt += f'<text x="30" y="{y}" clip-path="url(#c{i})" fill="#e6edf3" font-size="15" style="{M}">{inner}</text>'
              body = ('<rect x="2" y="2" width="896" height="326" rx="14" fill="#0d1117" stroke="#00d2ff" stroke-width="2"><animate attributeName="stroke" values="#00d2ff;#7f00ff;#ff6b9d;#00d2ff" dur="6s" repeatCount="indefinite"/></rect>'
                      '<path d="M2 16a14 14 0 0 1 14-14h868a14 14 0 0 1 14 14v22H2z" fill="#161b22"/>'
                      '<circle cx="28" cy="20" r="6" fill="#ff5f56"/><circle cx="50" cy="20" r="6" fill="#ffbd2e"/><circle cx="72" cy="20" r="6" fill="#27c93f"/>'
                      f'<text x="450" y="25" text-anchor="middle" font-size="13" fill="#8b949e" style="{M}">ahmed@flutter: ~</text>'
                      f'<defs>{clips}</defs>{txt}'
                      f'<rect x="30" y="{80+9*27-14}" width="10" height="18" fill="#00d2ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>')
              save('terminal.svg', svg(w, h, '', '', body))

          def cards(fn, items, cols=2, w=900, ch=54, gap=14, fs=17):
              n = len(items); rows = math.ceil(n / cols); h = rows * (ch + gap) + gap
              cw = (w - gap * (cols + 1)) / cols; T = n * 0.45 + 5; css = ''; body = ''
              for i, (ic, tx) in enumerate(items):
                  r, c = divmod(i, cols); x = gap + c * (cw + gap); y = gap + r * (ch + gap); col = C[i % 5]
                  p0 = i * 0.45 / T * 100; p1 = p0 + 3
                  css += f'@keyframes k{i}{{0%,{p0:.2f}%{{opacity:0;transform:translateX(-50px)}}{p1:.2f}%,90%{{opacity:1;transform:translateX(0)}}96%,100%{{opacity:0;transform:translateX(50px)}}}}.c{i}{{opacity:0;animation:k{i} {T:.1f}s ease-in-out infinite}}'
                  body += (f'<g class="c{i}"><rect x="{x:.1f}" y="{y}" width="{cw:.1f}" height="{ch}" rx="14" fill="#161b22" stroke="{col}" stroke-opacity=".55"/>'
                           f'<rect x="{x:.1f}" y="{y}" width="6" height="{ch}" rx="3" fill="{col}"/>'
                           f'<text x="{x+30:.1f}" y="{y+ch/2+9}" font-size="25">{ic}</text>'
                           f'<text x="{x+72:.1f}" y="{y+ch/2+6}" font-size="{fs}" font-weight="600" fill="#e6edf3">{esc(tx)}</text></g>')
              save(fn, svg(w, h, '', css, body))

          def bars(fn, items, w=900):
              rh = 50; h = len(items) * rh + 20
              css = ('.b{transform-box:fill-box;transform-origin:left;animation:bar 8s ease-out infinite}@keyframes bar{0%{transform:scaleX(0)}22%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}'
                     '.p{opacity:0;animation:pt 8s ease-out infinite}@keyframes pt{0%,15%{opacity:0}28%,88%{opacity:1}100%{opacity:0}}')
              body = ''
              for i, (ic, lab, p) in enumerate(items):
                  y = 10 + i * rh; col = C[i % 5]
                  body += (f'<text x="30" y="{y+25}" font-size="24">{ic}</text><text x="72" y="{y+24}" font-size="17" font-weight="600" fill="#e6edf3">{esc(lab)}</text>'
                           f'<rect x="400" y="{y+8}" width="400" height="18" rx="9" fill="#21262d"/>'
                           f'<rect class="b" style="animation-delay:{i*0.25}s" x="400" y="{y+8}" width="{400*p/100:.0f}" height="18" rx="9" fill="{col}"/>'
                           f'<text class="p" style="animation-delay:{i*0.25}s" x="815" y="{y+24}" font-size="16" font-weight="700" fill="{col}">{p}%</text>')
              save(fn, svg(w, h, '', css, body))

          def marquee():
              techs = [('Flutter','#02569B'),('Dart','#0175C2'),('BLoC','#512BD4'),('Cubit','#7B42BC'),('Provider','#4285F4'),('REST API','#005571'),('Dio','#0175C2'),('HTTP','#4CAF50'),('Firebase','#E8A400'),('Supabase','#3ECF8E'),('Hive','#E0A800'),('SharedPreferences','#607D8B'),('OOP','#2f81f7'),('SOLID','#2ea043'),('Clean Architecture','#f0883e'),('Git','#F05033'),('GitHub','#6e7681'),('VS Code','#007ACC')]
              x = 0; grp = ''
              for name, col in techs:
                  pw = len(name) * 10 + 36
                  grp += f'<g transform="translate({x},11)"><rect width="{pw}" height="38" rx="19" fill="{col}"/><text x="{pw/2}" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">{esc(name)}</text></g>'
                  x += pw + 14
              G = x
              css = f'.m{{animation:mv {G/55:.0f}s linear infinite}}@keyframes mv{{from{{transform:translateX(0)}}to{{transform:translateX(-{G}px)}}}}'
              body = f'<g class="m">{grp}<g transform="translate({G},0)">{grp}</g><g transform="translate({2*G},0)">{grp}</g></g>'
              save('marquee.svg', svg(900, 60, '', css, body))

          def orbit():
              w, h, cx, cy = 900, 380, 450, 190
              def ring(r, items, dur, rev, off=0):
                  s = ''
                  for k, (name, c) in enumerate(items):
                      a = 2 * math.pi * k / len(items) + off; x = cx + r * math.cos(a); y = cy + r * math.sin(a); pw = len(name) * 9 + 30
                      s += (f'<g transform="translate({x:.1f},{y:.1f})"><g><animateTransform attributeName="transform" type="rotate" from="0" to="{360 if rev else -360}" dur="{dur}s" repeatCount="indefinite"/>'
                            f'<rect x="{-pw/2}" y="-17" width="{pw}" height="34" rx="17" fill="{c}"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">{esc(name)}</text></g></g>')
                  return (f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="none" stroke="#30363d" stroke-dasharray="5 8"/>'
                          f'<g><animateTransform attributeName="transform" type="rotate" from="0 {cx} {cy}" to="{-360 if rev else 360} {cx} {cy}" dur="{dur}s" repeatCount="indefinite"/>{s}</g>')
              defs = '<radialGradient id="cg"><stop offset="0" stop-color="#00d2ff"/><stop offset="1" stop-color="#7f00ff"/></radialGradient><filter id="bl"><feGaussianBlur stdDeviation="22"/></filter>'
              body = (f'<circle cx="{cx}" cy="{cy}" r="80" fill="#7f00ff" opacity=".35" filter="url(#bl)"><animate attributeName="r" values="80;110;80" dur="4s" repeatCount="indefinite"/></circle>'
                      + ring(105, [('Dart', '#0175C2'), ('BLoC', '#512BD4'), ('Cubit', '#7B42BC'), ('Provider', '#4285F4')], 18, False)
                      + ring(172, [('Firebase', '#E8A400'), ('Supabase', '#3ECF8E'), ('Hive', '#E0A800'), ('Dio', '#0175C2'), ('REST API', '#005571'), ('Clean Arch', '#f0883e')], 34, True, 0.35)
                      + f'<circle cx="{cx}" cy="{cy}" r="40" fill="url(#cg)"><animate attributeName="r" values="38;44;38" dur="2.4s" repeatCount="indefinite"/></circle>'
                      + f'<text x="{cx}" y="{cy+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Flutter</text>')
              save('orbit.svg', svg(w, h, defs, '', body))

          terminal(); marquee(); orbit()
          cards('about.svg', [('📱', 'Flutter & Dart Developer'), ('🧱', 'Strong OOP Understanding'), ('⚡', 'State Mgmt: BLoC, Cubit & Provider'), ('🌐', 'REST APIs: HTTP & Dio'),
              ('☁️', 'Backend: Firebase & Supabase'), ('💾', 'Storage: Hive & SharedPreferences'), ('🏗️', 'Clean Architecture & SOLID'), ('📚', 'Always learning & improving')], 2)
          bars('learning.svg', [('🏗️', 'Advanced Clean Architecture', 70), ('🧪', 'Unit & Widget Testing', 50), ('💉', 'Dependency Injection (GetIt)', 60), ('🧩', 'Design Patterns', 55),
              ('🔄', 'CI/CD', 35), ('⚡', 'Performance Optimization', 45), ('🚀', 'Advanced Flutter Development', 65)])
          cards('goals.svg', [('🚀', 'Build production-ready mobile applications'), ('🛒', 'Publish applications on Google Play Store'), ('🧠', 'Improve software engineering and problem-solving skills'),
              ('🤝', 'Contribute to Open Source Projects'), ('👑', 'Grow as a Professional Flutter Developer')], 1)
          print('done', sorted(os.listdir('dist')))
          PYEOF

      - name: Push to assets branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: assets
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
